<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
	<!--
		The settings preview's SAMPLE card image.

		DELIBERATELY NOT PHOTOGRAPHY. The preview draws illustrative events, and a
		stock photo would read as "this is what your site looks like" rather than
		"this is where your image goes". A hatch plus a picture glyph cannot be
		mistaken for content.

		SHIPPED AS A FILE, NOT A data: URI. `Renderer::card()` runs the thumbnail
		through `esc_url()`, and `data` is absent from `wp_allowed_protocols()` —
		esc_url() returns '' for a data URI, raw or base64, so an inline placeholder
		would render `src=""`. A plugin-local file is same-origin, offline, and needs
		no widening of the renderer's escaping.

		THE FIELD IS TRANSPARENT ON PURPOSE. `.ecsa-card__thumb` paints the
		accent-soft custom property behind it, so the placeholder picks up the
		palette the admin is actually configuring and never flashes a light-grey
		plate on a dark preset. The one mid-grey it does use reads against both
		extremes.

		NOTE FOR EDITORS: this is an XML comment, so it may not contain a double
		hyphen anywhere. Writing a CSS custom property with its leading dashes in
		here makes the whole file invalid XML, and an invalid SVG loaded through
		`<img src>` renders NOTHING rather than degrading. Name properties without
		their dashes inside this comment.
	-->
	<defs>
		<pattern id="ecsa-ph-hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
			<line x1="0" y1="0" x2="0" y2="18" stroke="#8b929c" stroke-width="7" opacity="0.11"/>
		</pattern>
	</defs>
	<rect width="400" height="225" fill="url(#ecsa-ph-hatch)"/>
	<g fill="none" stroke="#8b929c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
		<rect x="152" y="78" width="96" height="72" rx="9"/>
		<circle cx="177" cy="101" r="8"/>
		<path d="M157 141 L182 112 L200 128 L216 116 L243 141"/>
	</g>
</svg>
